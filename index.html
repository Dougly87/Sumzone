<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumzone – Free Online Play in Your Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ff;--surface:#ffffff;--ink:#1b1740;--muted:#6b6790;--line:#e1ddf5;--accent:#ff3d81;--accent-ink:#ffffff;--hot:#ff6a2b;--new:#2bb673;--shadow:0 6px 18px rgba(27,23,64,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122e;--surface:#211d44;--ink:#f1eeff;--muted:#a49fd1;--line:#332e63;--accent:#ff5c95;--shadow:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15122e;--surface:#211d44;--ink:#f1eeff;--muted:#a49fd1;--line:#332e63;--accent:#ff5c95;--shadow:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.04em;color:var(--accent);margin-right:auto}
.icon-btn{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-width:42px;height:42px;padding:0 12px;font-weight:600}
.icon-btn:hover{border-color:var(--accent)}
.layout{display:flex;max-width:1500px;margin:0 auto}
nav.side{width:220px;flex:none;padding:16px;position:sticky;top:calc(63px + env(safe-area-inset-top,0px));align-self:flex-start;max-height:calc(100vh - 63px);overflow-y:auto}
nav.side a{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600}
nav.side a:hover{background:var(--surface);color:var(--ink)}
nav.side a.on{background:var(--accent);color:var(--accent-ink)}
nav.side hr{border:0;border-top:1px solid var(--line);margin:10px 0}
main{flex:1;min-width:0;padding:16px 16px 40px}
h1{font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.03em;margin:8px 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
.row{margin-bottom:28px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.row-head h2{font-size:1.3rem;margin:0;letter-spacing:-.02em}
.row-head h2 a:hover{color:var(--accent)}
.arrows button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.arrows button:hover{border-color:var(--accent)}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;flex:none;width:150px;scroll-snap-align:start;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-align:left;border:0;padding:0;transition:transform .15s}
.grid .tile{width:auto}
.tile:hover{transform:translateY(-3px)}
.art{aspect-ratio:1;display:grid;place-items:center;font-size:3.4rem}
.tile .name{padding:8px 10px 10px;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}
.badge.hot{background:var(--hot)}.badge.new{background:var(--new)}
.heart{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,18,46,.45);color:#fff;font-size:1rem;display:grid;place-items:center}
.heart.on{background:var(--accent)}
.empty{padding:28px;border:2px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
.seo{max-width:70ch;margin-top:24px;color:var(--muted)}
.seo h2{color:var(--ink);font-size:1.2rem}
footer{border-top:1px solid var(--line);padding:20px 16px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;color:var(--muted);font-size:.9rem}
footer a:hover{color:var(--accent)}
dialog{width:min(900px,94vw);border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,8,30,.7)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0 auto 0 0;font-size:1.2rem}
.stage{aspect-ratio:16/9;margin:16px;border-radius:14px;display:grid;place-items:center;text-align:center;color:#fff;padding:16px}
.stage b{display:block;font-size:4rem}
#menuBtn{display:none}
@media (max-width:820px){
 #menuBtn{display:inline-block}
 nav.side{position:fixed;left:0;top:0;bottom:0;max-height:none;width:250px;background:var(--surface);z-index:40;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .2s}
 nav.side.open{transform:none;box-shadow:var(--shadow)}
 .tile{width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
 <a class="logo" href="#home">sumzone</a>
 <button class="icon-btn" id="favBtn" aria-label="Favourites">♥ <span id="favCount">0</span></button>
 <button class="icon-btn" id="themeBtn" aria-label="Switch theme">◐</button>
</header>
<div class="layout">
 <nav class="side" id="side" aria-label="Main"></nav>
 <main id="main"></main>
</div>
<footer><a href="#home">About us</a><a href="#home">Copyright</a><a href="#home">Privacy policy</a><a href="#home">Terms of use</a><a href="#home">Contact us</a><span>© 2026 Sumzone</span></footer>

<dialog id="dlg">
 <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="icon-btn" id="dlgFav" aria-label="Favourite">♥</button><button class="icon-btn" id="dlgClose" aria-label="Close">✕</button></div>
 <div class="stage" id="stage"></div>
</dialog>

<script>
var CATS={
 casual:{label:"Casual",icon:"🐍",items:["Snake Apple"]}
};
var ALL=[],BY={};
Object.keys(CATS).forEach(function(k){CATS[k].items.forEach(function(n,i){
 var id=n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
 if(BY[id])return;
 var h=0;for(var c=0;c<id.length;c++)h=(h*31+id.charCodeAt(c))%360;
 var g={id:id,name:n,cat:k,icon:CATS[k].icon,hue:h,hot:i<2,isNew:i>=6};
 BY[id]=g;ALL.push(g);
});});

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var favs=load("zingo_favs",[]),recent=load("zingo_recent",[]);
var view=(location.hash||"#home").slice(1);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function art(g){return "background:linear-gradient(135deg,hsl("+g.hue+",85%,58%),hsl("+((g.hue+50)%360)+",80%,45%))"}
function tile(g){
 var f=favs.indexOf(g.id)>-1;
 return '<div class="tile-wrap" style="display:contents"><div class="tile" data-id="'+g.id+'" role="button" tabindex="0" aria-label="Play '+esc(g.name)+'">'+
 '<div class="art" style="'+art(g)+'">'+g.icon+'</div>'+
 (g.hot?'<span class="badge hot">Hot</span>':g.isNew?'<span class="badge new">New</span>':'')+
 '<button class="heart'+(f?' on':'')+'" data-fav="'+g.id+'" aria-label="Favourite '+esc(g.name)+'">♥</button>'+
 '<div class="name">'+esc(g.name)+'</div></div></div>';
}
function rowOf(title,list,href){
 return '<section class="row"><div class="row-head"><h2>'+(href?'<a href="'+href+'">'+title+'</a>':title)+'</h2><div class="arrows"><button data-sc="-1" aria-label="Scroll left">‹</button> <button data-sc="1" aria-label="Scroll right">›</button></div></div><div class="scroller">'+list.map(tile).join("")+'</div></section>';
}
function byIds(ids){return ids.map(function(i){return BY[i]}).filter(Boolean)}

function nav(){
 var h='<a href="#home" class="'+(view=="home"?"on":"")+'">🏠 Home</a><a href="#recent" class="'+(view=="recent"?"on":"")+'">🕘 Recently played</a><hr>';
 Object.keys(CATS).forEach(function(k){h+='<a href="#'+k+'" class="'+(view==k?"on":"")+'">'+CATS[k].icon+' '+CATS[k].label+'</a>'});
 document.getElementById("side").innerHTML=h;
}
function render(){
 nav();
 var m=document.getElementById("main"),h="";
 document.getElementById("favCount").textContent=favs.length;
 if(view=="home"||!(CATS[view]||view=="recent"||view=="favs")){
  var hot=ALL.filter(function(g){return g.hot}),nw=ALL.filter(function(g){return g.isNew});
  h='<h1>Free online play</h1><p class="sub">No downloads, no sign-up. Pick a tile and start.</p>'+
   rowOf("Hot this week",hot)+(nw.length?rowOf("New",nw):"");
  Object.keys(CATS).forEach(function(k){h+=rowOf(CATS[k].label,ALL.filter(function(g){return g.cat==k}),"#"+k)});
  h+='<div class="seo"><h2>Play free in your browser</h2><p>Sumzone is a free place to play quick browser titles on desktop, tablet and phone. Nothing to install and no account to make. Your favourites and recent plays stay on your device.</p></div>';
 }else if(view=="recent"){
  var r=byIds(recent);
  h='<h1>Recently played</h1><p class="sub">Your last '+(r.length||"few")+' picks.</p>'+(r.length?'<div class="grid">'+r.map(tile).join("")+'</div>':'<div class="empty">Nothing yet. Play something and it will show up here.</div>');
 }else if(view=="favs"){
  var f=byIds(favs);
  h='<h1>Favourites</h1><p class="sub">Tap the heart on any tile to save it here.</p>'+(f.length?'<div class="grid">'+f.map(tile).join("")+'</div>':'<div class="empty">No favourites yet. Tap the heart on a tile to add one.</div>');
 }else{
  h='<h1>'+CATS[view].icon+' '+CATS[view].label+'</h1><p class="sub">'+CATS[view].items.length+' picks</p><div class="grid">'+ALL.filter(function(g){return g.cat==view}).map(tile).join("")+'</div>';
 }
 m.innerHTML=h;
}
function setView(v){view=v;render();window.scrollTo(0,0);document.getElementById("side").classList.remove("open")}
window.addEventListener("hashchange",function(){setView((location.hash||"#home").slice(1))});

var dlg=document.getElementById("dlg"),cur=null;
function openGame(id){
 var g=BY[id];if(!g)return;cur=g;
 recent=[id].concat(recent.filter(function(x){return x!=id})).slice(0,24);save("zingo_recent",recent);
 document.getElementById("dlgTitle").textContent=g.name;
 var st=document.getElementById("stage");st.style.cssText=art(g);
 st.innerHTML='<div><b>'+g.icon+'</b>'+esc(g.name)+'<br><br><button id="fsBtn" style="font-family:monospace;border:0;border-radius:5px;background:#1E90FF;color:#fff;padding:12px 46px;font-size:20px;cursor:pointer">PLAY FULLSCREEN</button></div>';
 document.getElementById("fsBtn").onclick=playFull;
 syncDlgFav();
 if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}
var GAME_URL="https://script.google.com/macros/s/AKfycbymKWcUrgUql0KiwDqccDBMbYJB8_gxtlKCbQ5C6lfGB90kOJh4MpLqhMGWjtF7TyBskw/exec";
var gameWin;
function playFull(){
 if(gameWin&&!gameWin.closed){gameWin.focus();return}
 gameWin=window.open();
 if(!gameWin){alert("The new tab was blocked. Allow pop-ups for this page and try again.");return}
 gameWin.document.body.style.margin="0";
 gameWin.document.body.style.height="100vh";
 var f=gameWin.document.createElement("iframe");
 f.style.cssText="border:none;width:100%;height:100%;margin:0";
 f.src=GAME_URL;
 gameWin.document.body.appendChild(f);
}
function syncDlgFav(){var b=document.getElementById("dlgFav");var on=cur&&favs.indexOf(cur.id)>-1;b.style.background=on?"var(--accent)":"";b.style.color=on?"#fff":""}
function toggleFav(id){
 var i=favs.indexOf(id);if(i>-1)favs.splice(i,1);else favs.push(id);
 save("zingo_favs",favs);
 document.getElementById("favCount").textContent=favs.length;
 document.querySelectorAll('[data-fav="'+id+'"]').forEach(function(b){b.classList.toggle("on",favs.indexOf(id)>-1)});
 syncDlgFav();if(view=="favs")render();
}
document.addEventListener("click",function(e){
 var t=e.target;
 var fb=t.closest("[data-fav]");if(fb){e.stopPropagation();toggleFav(fb.getAttribute("data-fav"));return}
 var sc=t.closest("[data-sc]");if(sc){var s=sc.closest(".row").querySelector(".scroller");s.scrollBy({left:s.clientWidth*.8*sc.getAttribute("data-sc"),behavior:"smooth"});return}
 var tl=t.closest(".tile");if(tl){openGame(tl.getAttribute("data-id"))}
});
document.addEventListener("keydown",function(e){
 if((e.key=="Enter"||e.key==" ")&&e.target.classList&&e.target.classList.contains("tile")){e.preventDefault();openGame(e.target.getAttribute("data-id"))}
});
document.getElementById("dlgClose").onclick=function(){dlg.close()};
document.getElementById("dlgFav").onclick=function(){if(cur)toggleFav(cur.id)};
dlg.addEventListener("close",function(){if(view=="recent")render()});
document.getElementById("favBtn").onclick=function(){location.hash="favs"};
document.getElementById("menuBtn").onclick=function(){document.getElementById("side").classList.toggle("open")};
document.getElementById("themeBtn").onclick=function(){
 var r=document.documentElement,dark=r.getAttribute("data-theme")?r.getAttribute("data-theme")=="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 var n=dark?"light":"dark";r.setAttribute("data-theme",n);save("zingo_theme",n);
};
var th=load("zingo_theme",null);if(th)document.documentElement.setAttribute("data-theme",th);
render();
</script>
</body>
</html>
