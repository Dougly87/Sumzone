<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumzone – Free Online Play in Your Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a12;--surface:#0f1522;--ink:#e6edf7;--muted:#8190a8;--line:#1d2740;--accent:#4de3d1;--accent-ink:#04141a;--a2:#8b6cf6;--glass:rgba(10,14,24,.72);--hot:#ff7a45;--new:#34d399;--shadow:0 10px 30px rgba(0,0,0,.5);--glow:rgba(77,227,209,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#e6ebf3;--surface:#f4f7fb;--ink:#141c2b;--muted:#5b6a80;--line:#c9d3e2;--accent:#0f8f86;--accent-ink:#ffffff;--a2:#6d4fe0;--glass:rgba(244,247,251,.8);--hot:#d9622c;--new:#188f66;--shadow:0 8px 24px rgba(20,28,43,.15);--glow:rgba(15,143,134,.25);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;background:radial-gradient(800px 460px at 8% -8%,rgba(77,227,209,.13),transparent 60%),radial-gradient(760px 480px at 100% 0,rgba(139,108,246,.15),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(14px);z-index:30}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.7rem;letter-spacing:-.05em;margin-right:auto;background:linear-gradient(90deg,var(--accent),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px var(--glow))}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:42px;height:42px;padding:0 12px;font-weight:600;transition:.15s}
.icon-btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.layout{display:flex;max-width:1500px;margin:0 auto}
nav.side{width:230px;flex:none;padding:18px 14px;position:sticky;top:calc(67px + env(safe-area-inset-top,0px));align-self:flex-start;max-height:calc(100vh - 67px);overflow-y:auto}
nav.side a{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:12px;color:var(--muted);font-weight:600;transition:.15s}
nav.side a:hover{background:var(--surface);color:var(--ink);transform:translateX(3px)}
nav.side a.on{background:linear-gradient(90deg,var(--accent),var(--a2));color:var(--accent-ink);box-shadow:0 6px 20px var(--glow)}
nav.side hr{border:0;border-top:1px solid var(--line);margin:12px 0}
main{flex:1;min-width:0;padding:18px 20px 48px}
main h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.045em;line-height:1.05;margin:10px 0 8px;font-weight:800;background:linear-gradient(90deg,var(--ink),var(--accent) 60%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 26px;font-size:1.05rem}
.row{margin-bottom:30px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.row-head h2{font-size:1.25rem;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.row-head h2::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(var(--accent),var(--a2))}
.row-head h2 a:hover{color:var(--accent)}
.arrows button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);transition:.15s}
.arrows button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.scroller{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 4px 16px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.tile{position:relative;flex:none;width:160px;scroll-snap-align:start;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;padding:0;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.grid .tile{width:auto}
.tile:hover{transform:translateY(-6px) scale(1.03);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 16px 36px var(--glow)}
.art{color:#fff;aspect-ratio:1;display:grid;place-items:center;font-size:3.6rem;position:relative}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.26),transparent 55%)}
.tile .name{padding:10px 12px 12px;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:9px;left:9px;font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:99px;color:#fff;letter-spacing:.03em;text-transform:uppercase}
.badge.hot{background:var(--hot)}.badge.new{background:var(--new)}
.heart{position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(7,10,18,.55);backdrop-filter:blur(6px);color:#fff;font-size:1rem;display:grid;place-items:center;transition:.15s}
.heart:hover{transform:scale(1.15)}
.heart.on{background:var(--accent);color:var(--accent-ink)}
.empty{padding:32px;border:2px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--line);padding:22px 16px;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;color:var(--muted);font-size:.9rem}
footer a:hover{color:var(--accent)}
dialog{width:min(900px,94vw);border:1px solid var(--line);border-radius:22px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6),0 0 60px var(--glow)}
dialog.wide{width:min(1040px,96vw)}
dialog::backdrop{background:rgba(4,6,12,.78);backdrop-filter:blur(6px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0 auto 0 0;font-size:1.25rem;letter-spacing:-.02em}
.stage{aspect-ratio:16/9;margin:16px;border-radius:16px;display:grid;place-items:center;text-align:center;color:#fff;padding:16px}
.stage b{display:block;font-size:4rem}
#menuBtn{display:none}
@media (max-width:820px){
 #menuBtn{display:inline-block}
 nav.side{position:fixed;left:0;top:0;bottom:0;max-height:none;width:260px;background:var(--surface);z-index:40;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .2s}
 nav.side.open{transform:none;box-shadow:var(--shadow)}
 .tile{width:136px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
 <a class="logo" href="#home">sumzone</a>
 <button class="icon-btn" id="favBtn" aria-label="Favourites">♥ <span id="favCount">0</span></button>
 <button class="icon-btn" id="themeBtn" aria-label="Switch theme">◐</button>
</header>
<div class="layout">
 <nav class="side" id="side" aria-label="Main"></nav>
 <main id="main"></main>
</div>
<footer><a href="#home">About us</a><a href="#home">Copyright</a><a href="#home">Privacy policy</a><a href="#home">Terms of use</a><a href="#home">Contact us</a><span>© 2026 Sumzone</span></footer>

<dialog id="dlg">
 <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="icon-btn" id="dlgFav" aria-label="Favourite">♥</button><button class="icon-btn" id="dlgClose" aria-label="Close">✕</button></div>
 <div class="stage" id="stage"></div>
</dialog>

<script>
var CUBE='<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.12em"><path d="M12 2l9 5v10l-9 5-9-5V7zM12 12l9-5M12 12L3 7M12 12v10"/></svg>';
var CATS={
 driving:{label:"Driving",icon:"🚗",items:["Kart","Hill"]},
 sports:{label:"Sports",icon:"⚽",items:["Liquid"]},
 arcade:{label:"Arcade",icon:CUBE,items:["Geometry"]},
 casual:{label:"Casual",icon:"🔵",items:["Circle"]}
};
var ALL=[],BY={};
Object.keys(CATS).forEach(function(k){CATS[k].items.forEach(function(n,i){
 var id=n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
 if(BY[id])return;
 var h=0;for(var c=0;c<id.length;c++)h=(h*31+id.charCodeAt(c))%360;
 var g={id:id,name:n,cat:k,icon:CATS[k].icon,hue:h,hot:i<2,isNew:i>=6};
 BY[id]=g;ALL.push(g);
});});

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var favs=load("zingo_favs",[]),recent=load("zingo_recent",[]);
var view=(location.hash||"#home").slice(1);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function art(g){return "background:linear-gradient(135deg,hsl("+g.hue+",62%,40%),hsl("+((g.hue+50)%360)+",60%,20%))"}
function tile(g){
 var f=favs.indexOf(g.id)>-1;
 return '<div class="tile-wrap" style="display:contents"><div class="tile" data-id="'+g.id+'" role="button" tabindex="0" aria-label="Play '+esc(g.name)+'">'+
 '<div class="art" style="'+art(g)+'">'+g.icon+'</div>'+
 (g.hot?'<span class="badge hot">Hot</span>':g.isNew?'<span class="badge new">New</span>':'')+
 '<button class="heart'+(f?' on':'')+'" data-fav="'+g.id+'" aria-label="Favourite '+esc(g.name)+'">♥</button>'+
 '<div class="name">'+esc(g.name)+'</div></div></div>';
}
function rowOf(title,list,href){
 return '<section class="row"><div class="row-head"><h2>'+(href?'<a href="'+href+'">'+title+'</a>':title)+'</h2><div class="arrows"><button data-sc="-1" aria-label="Scroll left">‹</button> <button data-sc="1" aria-label="Scroll right">›</button></div></div><div class="scroller">'+list.map(tile).join("")+'</div></section>';
}
function byIds(ids){return ids.map(function(i){return BY[i]}).filter(Boolean)}

function nav(){
 var h='<a href="#home" class="'+(view=="home"?"on":"")+'">🏠 Home</a><a href="#recent" class="'+(view=="recent"?"on":"")+'">🕘 Recently played</a><hr>';
 Object.keys(CATS).forEach(function(k){h+='<a href="#'+k+'" class="'+(view==k?"on":"")+'">'+CATS[k].icon+' '+CATS[k].label+'</a>'});
 document.getElementById("side").innerHTML=h;
}
function render(){
 nav();
 var m=document.getElementById("main"),h="";
 document.getElementById("favCount").textContent=favs.length;
 if(view=="home"||!(CATS[view]||view=="recent"||view=="favs")){
  var hot=ALL.filter(function(g){return g.hot}),nw=ALL.filter(function(g){return g.isNew});
  h='<h1>Jump in. Play now.</h1><p class="sub">No downloads. No sign-up. Just pick a tile.</p>'+
   rowOf("Hot this week",hot)+(nw.length?rowOf("New",nw):"");
  Object.keys(CATS).forEach(function(k){h+=rowOf(CATS[k].label,ALL.filter(function(g){return g.cat==k}),"#"+k)});
 }else if(view=="recent"){
  var r=byIds(recent);
  h='<h1>Recently played</h1><p class="sub">Your last '+(r.length||"few")+' picks.</p>'+(r.length?'<div class="grid">'+r.map(tile).join("")+'</div>':'<div class="empty">Nothing yet. Play something and it will show up here.</div>');
 }else if(view=="favs"){
  var f=byIds(favs);
  h='<h1>Favourites</h1><p class="sub">Tap the heart on any tile to save it here.</p>'+(f.length?'<div class="grid">'+f.map(tile).join("")+'</div>':'<div class="empty">No favourites yet. Tap the heart on a tile to add one.</div>');
 }else{
  h='<h1>'+CATS[view].icon+' '+CATS[view].label+'</h1><p class="sub">'+CATS[view].items.length+' picks</p><div class="grid">'+ALL.filter(function(g){return g.cat==view}).map(tile).join("")+'</div>';
 }
 m.innerHTML=h;
}
function setView(v){view=v;render();window.scrollTo(0,0);document.getElementById("side").classList.remove("open")}
window.addEventListener("hashchange",function(){setView((location.hash||"#home").slice(1))});

var dlg=document.getElementById("dlg"),cur=null;
function openGame(id){
 var g=BY[id];if(!g)return;cur=g;
 recent=[id].concat(recent.filter(function(x){return x!=id})).slice(0,24);save("zingo_recent",recent);
 document.getElementById("dlgTitle").textContent=g.name;
 var st=document.getElementById("stage");st.style.cssText=art(g);
 st.innerHTML='<div><b>'+g.icon+'</b>'+esc(g.name)+'<br><br><button id="fsBtn" style="font-family:monospace;border:0;border-radius:5px;background:#1E90FF;color:#fff;padding:12px 46px;font-size:20px;cursor:pointer">PLAY FULLSCREEN</button></div>';
 document.getElementById("fsBtn").onclick=playFull;
 syncDlgFav();
 if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}
var GAME_URLS={"kart":"https://script.google.com/macros/s/AKfycbxb8isaXXwqY7h3OqafbfonnaOEmyfyK8ZQoMvgT-HGwUSfpJoK5Aim1Ca3fvKvEqxj/exec"};
var GAME_FILES={"hill":"hill.html","liquid":"liquid.html","geometry":"geometry.html","circle":"circle.html"};
var gameWins={};
function playFull(){
 var id=cur.id,GAME_URL=GAME_URLS[id]&&new URL(GAME_URLS[id],location.href).href,file=GAME_FILES[id]&&new URL(GAME_FILES[id],location.href).href,gameWin=gameWins[id];
 if(gameWin&&!gameWin.closed){gameWin.focus();return}
 gameWin=gameWins[id]=window.open();
 if(!gameWin){alert("The new tab was blocked. Allow pop-ups for this page and try again.");return}
 gameWin.document.body.style.margin="0";
 gameWin.document.body.style.height="100vh";
 var f=gameWin.document.createElement("iframe");
 f.style.cssText="border:none;width:100%;height:100%;margin:0";
 if(file){
  fetch(file).then(function(r){if(!r.ok)throw new Error("missing");return r.text()}).then(function(t){
   if(!t.replace(/<!--[\s\S]*?-->/g,"").trim()){gameWin.close();gameWins[id]=undefined;alert("No game code has been pasted into "+GAME_FILES[id]+" yet.");return}
   f.srcdoc=t;gameWin.document.body.appendChild(f);
  }).catch(function(){gameWin.close();gameWins[id]=undefined;alert("Could not load "+GAME_FILES[id]+". Make sure it is uploaded next to index.html.")});
 }else{f.src=GAME_URL;gameWin.document.body.appendChild(f)}
}
function syncDlgFav(){var b=document.getElementById("dlgFav");var on=cur&&favs.indexOf(cur.id)>-1;b.style.background=on?"var(--accent)":"";b.style.color=on?"#fff":""}
function toggleFav(id){
 var i=favs.indexOf(id);if(i>-1)favs.splice(i,1);else favs.push(id);
 save("zingo_favs",favs);
 document.getElementById("favCount").textContent=favs.length;
 document.querySelectorAll('[data-fav="'+id+'"]').forEach(function(b){b.classList.toggle("on",favs.indexOf(id)>-1)});
 syncDlgFav();if(view=="favs")render();
}
document.addEventListener("click",function(e){
 var t=e.target;
 var fb=t.closest("[data-fav]");if(fb){e.stopPropagation();toggleFav(fb.getAttribute("data-fav"));return}
 var sc=t.closest("[data-sc]");if(sc){var s=sc.closest(".row").querySelector(".scroller");s.scrollBy({left:s.clientWidth*.8*sc.getAttribute("data-sc"),behavior:"smooth"});return}
 var tl=t.closest(".tile");if(tl){openGame(tl.getAttribute("data-id"))}
});
document.addEventListener("keydown",function(e){
 if((e.key=="Enter"||e.key==" ")&&e.target.classList&&e.target.classList.contains("tile")){e.preventDefault();openGame(e.target.getAttribute("data-id"))}
});
document.getElementById("dlgClose").onclick=function(){dlg.close()};
document.getElementById("dlgFav").onclick=function(){if(cur)toggleFav(cur.id)};
dlg.addEventListener("close",function(){document.getElementById("stage").innerHTML="";if(view=="recent")render()});
document.getElementById("favBtn").onclick=function(){location.hash="favs"};
document.getElementById("menuBtn").onclick=function(){document.getElementById("side").classList.toggle("open")};
document.getElementById("themeBtn").onclick=function(){
 var r=document.documentElement,dark=r.getAttribute("data-theme")!="light";
 var n=dark?"light":"dark";r.setAttribute("data-theme",n);save("zingo_theme",n);
};
var th=load("zingo_theme",null);if(th)document.documentElement.setAttribute("data-theme",th);
render();
</script>
</body>
</html>
